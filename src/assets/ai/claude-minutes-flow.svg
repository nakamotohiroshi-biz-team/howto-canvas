<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="rawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Claude 文字起こしテキストから超高精度な議事録・報告書を生成するフロー</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">誤認識や話し言葉（フィラー）を自動校正し、役員報告・チーム共有に耐える構造化ドキュメントへ変換</text>

  <!-- Step 1: 生の文字起こしデータ -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="40" y="110" width="220" height="40" rx="12" fill="url(#rawGrad)"/>
    <text x="150" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1. 生の文字起こしデータ</text>
    
    <circle cx="150" cy="190" r="28" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="150" y="198" text-anchor="middle" fill="#94a3b8" font-size="22">📄</text>

    <text x="150" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">粗削りな会話テキスト</text>
    <text x="60" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・「えー」「あのー」の重複</text>
    <text x="60" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・専門用語の変換ミス</text>
    <text x="60" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・誰が何を言ったかの乱れ</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="268,235 268,225 280,230" fill="#64748b"/>

  <!-- Step 2: Claude の推論・校正・構造化 -->
  <g filter="url(#shadow)">
    <rect x="290" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="290" y="110" width="220" height="40" rx="12" fill="url(#claudeGrad)"/>
    <text x="400" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">2. Claude による整形・校正</text>
    
    <circle cx="400" cy="190" r="28" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
    <text x="400" y="198" text-anchor="middle" fill="#fb923c" font-size="22">🧠</text>

    <text x="400" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">高度な文脈補正</text>
    <text x="310" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・文脈から誤字を自動修正</text>
    <text x="310" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・無駄な口癖を綺麗にカット</text>
    <text x="310" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・決定事項と議論過程を分離</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="518,235 518,225 530,230" fill="#64748b"/>

  <!-- Step 3: 完成した議事録・報告書 -->
  <g filter="url(#shadow)">
    <rect x="540" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="540" y="110" width="220" height="40" rx="12" fill="url(#outputGrad)"/>
    <text x="650" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">3. 完成ビジネスドキュメント</text>
    
    <circle cx="650" cy="190" r="28" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="650" y="198" text-anchor="middle" fill="#34d399" font-size="22">📊</text>

    <text x="650" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">そのまま社内配布可能</text>
    <text x="560" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・エグゼクティブサマリー</text>
    <text x="560" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・決定事項 &amp; アクションプラン</text>
    <text x="560" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・Markdown / 表形式レイアウト</text>
  </g>

  <!-- Bottom Tip -->
  <text x="400" y="390" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="12">
    💡 「&lt;transcript&gt;」タグで囲んで投入すると、プロンプトの誤読を防止して精度が最大化します
  </text>
</svg>
