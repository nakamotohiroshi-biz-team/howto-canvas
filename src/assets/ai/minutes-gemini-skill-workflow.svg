<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">録音から議事録・面談報告書まで 毎回同じ形で作る流れ</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">テンプレートをGeminiの「スキル」に登録しておけば、見出しも順序も毎回そろう</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="25" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="25" y="105" width="165" height="40" rx="12" fill="url(#recGrad)"/>
    <text x="107" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1. iPhoneで録音</text>
    <text x="107" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">ボイスメモ</text>
    <text x="40" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">・静かな場所で録る</text>
    <text x="40" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">・話者の近くに置く</text>
    <text x="40" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">・最初に議題を話す</text>
    <text x="40" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">・録音の許可を得る</text>
  </g>

  <polygon points="196,228 196,218 210,223" fill="#64748b"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="220" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="220" y="105" width="165" height="40" rx="12" fill="url(#nbGrad)"/>
    <text x="302" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">2. NotebookLM</text>
    <text x="302" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">文字起こし</text>
    <text x="235" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">・音声を読み込む</text>
    <text x="235" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">・全文を書き出す</text>
    <text x="235" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">・誤変換を確認する</text>
    <text x="235" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">・テキストをコピー</text>
  </g>

  <polygon points="391,228 391,218 405,223" fill="#64748b"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="415" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="415" y="105" width="165" height="40" rx="12" fill="url(#skillGrad)"/>
    <text x="497" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">3. Geminiスキル</text>
    <text x="497" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">毎回同じ型で整形</text>
    <text x="430" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">・「/」でスキルを呼ぶ</text>
    <text x="430" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">・見出しと順序を固定</text>
    <text x="430" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">・推測せず「要確認」</text>
    <text x="430" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">・議事録／面談報告書</text>
  </g>

  <polygon points="586,228 586,218 600,223" fill="#64748b"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="610" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="610" y="105" width="165" height="40" rx="12" fill="url(#docGrad)"/>
    <text x="692" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">4. Wordファイル</text>
    <text x="692" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">人が確認して完成</text>
    <text x="625" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">・.docxで出力を依頼</text>
    <text x="625" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">・自分のWord様式へ</text>
    <text x="625" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">・日付・人名を確認</text>
    <text x="625" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">・配布・保存する</text>
  </g>

  <!-- Bottom Tip -->
  <text x="400" y="385" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="12">
    ポイント: 面談など個人情報を含む録音は、学校のルールに従って扱う
  </text>
</svg>
