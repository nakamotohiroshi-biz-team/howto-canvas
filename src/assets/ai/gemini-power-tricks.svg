<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b82f6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Google Gemini 最新・便利な使い方＆裏技大全</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">Deep Research、Canvas部分推敲、自作Gem、スプレッドシート=AI関数、Gemini Live徹底活用</text>

  <!-- 3 Top Cards -->
  <!-- Card 1: Deep Research -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="225" height="145" rx="12" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="100" width="225" height="34" rx="12" fill="url(#headerGrad)"/>
    <text x="152" y="123" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">1. Deep Research 自動調査</text>
    
    <text x="55" y="160" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">・自律型多段階リサーチ</text>
    <text x="55" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11">数十サイトを横断検証し分析</text>
    <text x="55" y="205" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">・専門家レベルの長文レポート</text>
    <text x="55" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">市場動向・競合調査が1発完了</text>
  </g>

  <!-- Card 2: Canvas -->
  <g filter="url(#shadow)">
    <rect x="285" y="100" width="225" height="145" rx="12" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="285" y="100" width="225" height="34" rx="12" fill="#9333ea"/>
    <text x="397" y="123" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">2. Canvas でリアルタイム推敲</text>
    
    <text x="300" y="160" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">・気になる段落だけ範囲選択</text>
    <text x="300" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11">「短く」「トーン変更」が即座</text>
    <text x="300" y="205" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">・Docsへワンクリック出力</text>
    <text x="300" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">Googleドキュメントに即時転送</text>
  </g>

  <!-- Card 3: Gem (カスタムAI) -->
  <g filter="url(#shadow)">
    <rect x="530" y="100" width="230" height="145" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="530" y="100" width="230" height="34" rx="12" fill="#059669"/>
    <text x="645" y="123" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">3. Gem（自作専門家AI）</text>
    
    <text x="545" y="160" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">・ノーコードで専用AI作成</text>
    <text x="545" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11">「超一流の編集長」「法務顧問」</text>
    <text x="545" y="205" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">・1クリックで即時起動</text>
    <text x="545" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">定型プロンプトを再利用</text>
  </g>

  <!-- 3 Bottom Cards -->
  <!-- Card 4: スプレッドシートAI関数 -->
  <g filter="url(#shadow)">
    <rect x="40" y="260" width="225" height="135" rx="12" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="40" y="260" width="225" height="30" rx="12" fill="#0891b2"/>
    <text x="152" y="281" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4. スプレッドシート =AI() 関数</text>
    <text x="55" y="315" fill="#22d3ee" font-family="sans-serif" font-size="11" font-weight="bold">・セル内で直接AI呼び出し</text>
    <text x="55" y="335" fill="#94a3b8" font-family="sans-serif" font-size="10">=AI("感情分類して", A2)</text>
    <text x="55" y="355" fill="#22d3ee" font-family="sans-serif" font-size="11" font-weight="bold">・数千件のデータを一括処理</text>
    <text x="55" y="375" fill="#94a3b8" font-family="sans-serif" font-size="10">マクロやPython不要で自動化</text>
  </g>

  <!-- Card 5: Gemini Live -->
  <g filter="url(#shadow)">
    <rect x="285" y="260" width="225" height="135" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="285" y="260" width="225" height="30" rx="12" fill="#d97706"/>
    <text x="397" y="281" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">5. Gemini Live リアルタイム対話</text>
    <text x="300" y="315" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">・電話のように流暢な音声通話</text>
    <text x="300" y="335" fill="#94a3b8" font-family="sans-serif" font-size="10">途切れず自然な英会話・壁打ち</text>
    <text x="300" y="355" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">・カメラ映像をリアルタイム認識</text>
    <text x="300" y="375" fill="#94a3b8" font-family="sans-serif" font-size="10">目の前の機械や資料を口頭質問</text>
  </g>

  <!-- Card 6: ハンドオーバー & 一時チャット -->
  <g filter="url(#shadow)">
    <rect x="530" y="260" width="230" height="135" rx="12" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="530" y="260" width="230" height="30" rx="12" fill="#db2777"/>
    <text x="645" y="281" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">6. 会話引き継ぎ＆機密保護</text>
    <text x="545" y="315" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">・ハンドオーバープロンプト</text>
    <text x="545" y="335" fill="#94a3b8" font-family="sans-serif" font-size="10">チャットが重くなったら即引き継ぎ</text>
    <text x="545" y="355" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">・一時チャットで完全匿名化</text>
    <text x="545" y="375" fill="#94a3b8" font-family="sans-serif" font-size="10">履歴に一切残さず安全利用</text>
  </g>
</svg>
