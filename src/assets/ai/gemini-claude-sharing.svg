<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Gemini Box -->
  <g filter="url(#shadow)">
    <rect x="70" y="100" width="200" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="70" y="100" width="200" height="40" rx="12" fill="url(#geminiGrad)"/>
    <text x="170" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Gemini (Google)</text>
    
    <text x="90" y="170" fill="#94a3b8" font-family="sans-serif" font-size="13">・Function Calling</text>
    <text x="90" y="200" fill="#94a3b8" font-family="sans-serif" font-size="13">・System Instruction</text>
    <text x="90" y="230" fill="#94a3b8" font-family="sans-serif" font-size="13">・JSON Schema 定義</text>
    <text x="90" y="260" fill="#38bdf8" font-family="sans-serif" font-size="12">skills / prompts</text>
  </g>

  <!-- Claude Box -->
  <g filter="url(#shadow)">
    <rect x="530" y="100" width="200" height="180" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="2"/>
    <rect x="530" y="100" width="200" height="40" rx="12" fill="url(#claudeGrad)"/>
    <text x="630" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Claude (Anthropic)</text>
    
    <text x="550" y="170" fill="#94a3b8" font-family="sans-serif" font-size="13">・Tool Use 定義</text>
    <text x="550" y="200" fill="#94a3b8" font-family="sans-serif" font-size="13">・System Prompt</text>
    <text x="550" y="230" fill="#94a3b8" font-family="sans-serif" font-size="13">・Projects / MCP</text>
    <text x="550" y="260" fill="#fb923c" font-family="sans-serif" font-size="12">skills / artifacts</text>
  </g>

  <!-- Center Bridge (Sharing Hub) -->
  <g filter="url(#shadow)">
    <rect x="310" y="120" width="180" height="140" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="400" cy="155" r="22" fill="url(#shareGrad)"/>
    <path d="M 390 155 L 400 145 L 400 152 L 410 152 L 410 158 L 400 158 L 400 165 Z" fill="#ffffff"/>
    <text x="400" y="198" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="bold">共通スキル形式</text>
    <text x="400" y="220" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12">Markdown + JSON</text>
    <text x="400" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">MCP / Schema 相互変換</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M 270 170 Q 290 170 310 170" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="308,166 316,170 308,174" fill="#38bdf8"/>

  <path d="M 310 210 Q 290 210 270 210" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="272,206 264,210 272,214" fill="#38bdf8"/>

  <path d="M 490 170 Q 510 170 530 170" stroke="#fb923c" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="528,166 536,170 528,174" fill="#fb923c"/>

  <path d="M 530 210 Q 510 210 490 210" stroke="#fb923c" stroke-width="3" stroke-dasharray="4" fill="none"/>
  <polygon points="492,206 484,210 492,214" fill="#fb923c"/>

  <!-- Footer Tagline -->
  <text x="400" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">
    指示文（Markdown）とツール定義（JSON Schema）を共通化してスムーズに移行
  </text>
</svg>
