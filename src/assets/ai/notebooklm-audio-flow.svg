<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="audioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">NotebookLM 音声から議事録・報告書を作成する全体フロー</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">会議録音を直接ソース登録し、自動文字起こしから構造化レポートまで一気通貫で生成</text>

  <!-- Step 1: 音声ファイルをソース追加 -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="40" y="110" width="220" height="40" rx="12" fill="url(#audioGrad)"/>
    <text x="150" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1. 音声ファイルを投入</text>
    
    <circle cx="150" cy="190" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="198" text-anchor="middle" fill="#38bdf8" font-size="22">🎙️</text>

    <text x="150" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">対応フォーマット</text>
    <text x="60" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・mp3, m4a, wav, aac</text>
    <text x="60" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・Google Drive上の録音</text>
    <text x="60" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・YouTube録画（URL直接）</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="268,235 268,225 280,230" fill="#64748b"/>

  <!-- Step 2: 自動文字起こし & 解析 -->
  <g filter="url(#shadow)">
    <rect x="290" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="290" y="110" width="220" height="40" rx="12" fill="url(#transGrad)"/>
    <text x="400" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">2. 自動文字起こし &amp; 参照</text>
    
    <circle cx="400" cy="190" r="28" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="400" y="198" text-anchor="middle" fill="#a78bfa" font-size="22">⚡</text>

    <text x="400" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">ソースとして内部保持</text>
    <text x="310" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・アップロード時に即テキスト化</text>
    <text x="310" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・話者や会話内容を構造把握</text>
    <text x="310" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・引用番号[1]で原本発言へ</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="518,235 518,225 530,230" fill="#64748b"/>

  <!-- Step 3: プロンプトで議事録・報告書化 -->
  <g filter="url(#shadow)">
    <rect x="540" y="110" width="220" height="250" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <rect x="540" y="110" width="220" height="40" rx="12" fill="url(#docGrad)"/>
    <text x="650" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">3. 議事録・報告書生成</text>
    
    <circle cx="650" cy="190" r="28" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="650" y="198" text-anchor="middle" fill="#34d399" font-size="22">📝</text>

    <text x="650" y="245" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">専用テンプレート出力</text>
    <text x="560" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">・決定事項（Decisions）</text>
    <text x="560" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">・ToDoタスク（担当者/期日）</text>
    <text x="560" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">・次回検討課題 &amp; サマリー</text>
  </g>

  <!-- Bottom Tip -->
  <text x="400" y="390" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12">
    💡 「ノートに保存」をクリックして、Googleドキュメントへ1発エクスポートできます
  </text>
</svg>
