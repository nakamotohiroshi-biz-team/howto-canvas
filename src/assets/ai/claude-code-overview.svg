<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="claudeBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Claude Code（ターミナル自律型コーディングエージェント）</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">コマンドラインから自然言語でコードベースの探索、編集、テスト、コミットを一貫実行</text>

  <!-- Left: Terminal Mockup -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="420" height="280" rx="12" fill="url(#terminalGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Terminal Title Bar -->
    <rect x="40" y="100" width="420" height="34" rx="12" fill="#1e293b"/>
    <circle cx="60" cy="117" r="5" fill="#ef4444"/>
    <circle cx="75" cy="117" r="5" fill="#f59e0b"/>
    <circle cx="90" cy="117" r="5" fill="#10b981"/>
    <text x="250" y="122" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Terminal - claude</text>

    <!-- Terminal Content -->
    <text x="60" y="160" fill="#f97316" font-family="monospace" font-size="13">$ claude</text>
    <text x="60" y="185" fill="#38bdf8" font-family="monospace" font-size="12">&gt; ログイン画面のバリデーションを追加して</text>
    <text x="60" y="215" fill="#94a3b8" font-family="monospace" font-size="11">● Searching codebase for 'LoginForm'...</text>
    <text x="60" y="235" fill="#94a3b8" font-family="monospace" font-size="11">● Reading src/components/LoginForm.tsx</text>
    <text x="60" y="255" fill="#10b981" font-family="monospace" font-size="11">● Editing src/components/LoginForm.tsx (+15, -2)</text>
    <text x="60" y="275" fill="#94a3b8" font-family="monospace" font-size="11">● Running tests: npm test</text>
    <text x="60" y="295" fill="#10b981" font-family="monospace" font-size="11">✓ All 12 tests passed!</text>
    <text x="60" y="325" fill="#e2e8f0" font-family="monospace" font-size="12">&gt; バリデーション処理を追加し、テストを通過させました。</text>
    <text x="60" y="350" fill="#f97316" font-family="monospace" font-size="12">&gt; コミットしますか？ (y/n) _</text>
  </g>

  <!-- Right: Capabilities Cards -->
  <g filter="url(#shadow)">
    <!-- Card 1 -->
    <rect x="480" y="100" width="280" height="80" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <text x="500" y="130" fill="#fb923c" font-family="sans-serif" font-size="14" font-weight="bold">🔍 コードベース全体を理解</text>
    <text x="500" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">複数ファイルを横断検索し文脈を把握</text>

    <!-- Card 2 -->
    <rect x="480" y="200" width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="500" y="230" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">⚡ 自律的にファイル編集・実行</text>
    <text x="500" y="255" fill="#94a3b8" font-family="sans-serif" font-size="12">コード修正からテスト実行まで自動完結</text>

    <!-- Card 3 -->
    <rect x="480" y="300" width="280" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="500" y="330" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">📝 Git連携・CLAUDE.md規約</text>
    <text x="500" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">プロジェクト固有のコーディング規約を遵守</text>
  </g>
</svg>
