<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="toolGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="toolGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="toolGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtitle / Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Claude スキル（Tool Use）連携アーキテクチャ</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">自然言語プロンプトから適切なツールスキーマを判断し自律実行</text>

  <!-- Claude Core Node -->
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="220" height="220" rx="16" fill="#1e293b" stroke="#ea580c" stroke-width="2"/>
    <rect x="70" y="120" width="220" height="44" rx="16" fill="url(#claudeGrad)"/>
    <text x="180" y="148" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Claude AI Brain</text>
    
    <circle cx="180" cy="220" r="36" fill="#0f172a" stroke="#f97316" stroke-width="3"/>
    <path d="M 165 220 L 175 230 L 195 210" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="280" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">意図解釈 &amp; 判断</text>
    <text x="180" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">JSONスキーマ自動マッチング</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 290 170 Q 380 140 450 140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5"/>
  <polygon points="448,136 456,140 448,144" fill="#38bdf8"/>

  <path d="M 290 230 L 450 230" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="5"/>
  <polygon points="448,226 456,230 448,234" fill="#34d399"/>

  <path d="M 290 290 Q 380 320 450 320" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="5"/>
  <polygon points="448,316 456,320 448,324" fill="#a78bfa"/>

  <!-- External Tool Nodes -->
  <!-- Tool 1: Web / API -->
  <g filter="url(#shadow)">
    <rect x="460" y="110" width="270" height="60" rx="10" fill="url(#toolGrad1)"/>
    <text x="480" y="136" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🌐 Web API ツール</text>
    <text x="480" y="155" fill="#bfdbfe" font-family="sans-serif" font-size="11">天気予報・検索・最新情報取得</text>
  </g>

  <!-- Tool 2: Database / Files -->
  <g filter="url(#shadow)">
    <rect x="460" y="200" width="270" height="60" rx="10" fill="url(#toolGrad2)"/>
    <text x="480" y="226" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">📁 ファイル・DB 操作</text>
    <text x="480" y="245" fill="#a7f3d0" font-family="sans-serif" font-size="11">ドキュメント読込・データ抽出</text>
  </g>

  <!-- Tool 3: Calculation / Image -->
  <g filter="url(#shadow)">
    <rect x="460" y="290" width="270" height="60" rx="10" fill="url(#toolGrad3)"/>
    <text x="480" y="316" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🎨 画像生成・データ計算</text>
    <text x="480" y="335" fill="#ddd6fe" font-family="sans-serif" font-size="11">NanoBanana生成・統計集計</text>
  </g>

  <!-- Bottom Guide -->
  <text x="400" y="375" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">
    スキーマ（引数の型と説明）を定義するだけで、Claudeが必要なタイミングで自動呼び出しします
  </text>
</svg>
