<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hostGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="hostGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">MCP（Model Context Protocol）統一アーキテクチャ</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">AIクライアントと多種多様な外部ツールを「1つの共通規格（JSON-RPC）」で接続</text>

  <!-- Left: AI Hosts (Clients) -->
  <g filter="url(#shadow)">
    <!-- Claude Desktop -->
    <rect x="40" y="110" width="200" height="110" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="40" y="110" width="200" height="34" rx="12" fill="url(#hostGrad1)"/>
    <text x="140" y="133" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Claude Desktop / Code</text>
    <text x="60" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="12">・claude_desktop_config.json</text>
    <text x="60" y="195" fill="#94a3b8" font-family="sans-serif" font-size="11">Anthropic標準クライアント</text>

    <!-- Gemini Host -->
    <rect x="40" y="250" width="200" height="110" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="250" width="200" height="34" rx="12" fill="url(#hostGrad2)"/>
    <text x="140" y="273" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Gemini (Antigravity/CLI)</text>
    <text x="60" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="12">・mcp_config.json</text>
    <text x="60" y="335" fill="#94a3b8" font-family="sans-serif" font-size="11">Google AIエージェント環境</text>
  </g>

  <!-- Center: MCP Protocol Bridge -->
  <g filter="url(#shadow)">
    <rect x="290" y="140" width="220" height="190" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <rect x="290" y="140" width="220" height="40" rx="16" fill="url(#mcpGrad)"/>
    <text x="400" y="166" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">MCP Protocol Layer</text>

    <text x="400" y="210" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">共通プロトコル (stdio / SSE)</text>
    <text x="400" y="235" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">・Tools（関数呼び出し）</text>
    <text x="400" y="255" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">・Resources（データ参照）</text>
    <text x="400" y="275" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">・Prompts（再利用テンプレート）</text>
    <text x="400" y="305" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11">「一度作れば両方で動く」</text>
  </g>

  <!-- Connecting Lines Left to Center -->
  <path d="M 240 165 L 290 200" stroke="#f97316" stroke-width="3" stroke-dasharray="4"/>
  <path d="M 240 305 L 290 270" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4"/>

  <!-- Right: MCP Servers (Resources & Tools) -->
  <g filter="url(#shadow)">
    <!-- Server 1 -->
    <rect x="560" y="105" width="200" height="55" rx="8" fill="url(#serverGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="580" y="130" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">📁 Filesystem Server</text>
    <text x="580" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11">ローカルファイル読み書き</text>

    <!-- Server 2 -->
    <rect x="560" y="175" width="200" height="55" rx="8" fill="url(#serverGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="580" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">🐙 GitHub Server</text>
    <text x="580" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">PR・Issue・コミット操作</text>

    <!-- Server 3 -->
    <rect x="560" y="245" width="200" height="55" rx="8" fill="url(#serverGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="580" y="270" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">🗄️ SQLite / DB Server</text>
    <text x="580" y="288" fill="#94a3b8" font-family="sans-serif" font-size="11">データベース直接クエリ</text>

    <!-- Server 4 -->
    <rect x="560" y="315" width="200" height="55" rx="8" fill="url(#serverGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="580" y="340" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">🌐 Web Fetch Server</text>
    <text x="580" y="358" fill="#94a3b8" font-family="sans-serif" font-size="11">最新Webページ取得・要約</text>
  </g>

  <!-- Connecting Lines Center to Right -->
  <path d="M 510 200 L 560 132" stroke="#10b981" stroke-width="2"/>
  <path d="M 510 220 L 560 202" stroke="#10b981" stroke-width="2"/>
  <path d="M 510 250 L 560 272" stroke="#10b981" stroke-width="2"/>
  <path d="M 510 270 L 560 342" stroke="#10b981" stroke-width="2"/>

  <!-- Footer Guide -->
  <text x="400" y="395" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">
    USB-Cのように、規格が1つあればAIモデルを問わずあらゆるツールをプラグ＆プレイで利用可能
  </text>
</svg>
