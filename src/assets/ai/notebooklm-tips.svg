<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">NotebookLM（Gemini Notebook）プロの裏技・活用法</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">アップロードした資料だけを完璧に参照する「ハルシネーションゼロ」AI活用</text>

  <!-- Card 1: 音声ポッドキャスト化 -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="225" height="270" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="40" y="105" width="225" height="40" rx="12" fill="url(#cardGrad1)"/>
    <text x="152" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🎙️ 音声解説（Audio Overview）</text>
    
    <circle cx="152" cy="185" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="152" y="192" text-anchor="middle" fill="#38bdf8" font-size="20">🎧</text>
    
    <text x="152" y="240" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">資料を2人の対談ラジオに</text>
    <text x="60" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・難解な論文や長文PDFも</text>
    <text x="60" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">・通勤中に耳でインプット</text>
    <text x="60" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">・AI同士が掛け合いで要約</text>
    <text x="152" y="355" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11">裏技: 指示文で対談の深さを制御</text>
  </g>

  <!-- Card 2: ソース限定ハック -->
  <g filter="url(#shadow)">
    <rect x="285" y="105" width="225" height="270" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="285" y="105" width="225" height="40" rx="12" fill="url(#cardGrad2)"/>
    <text x="397" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">📚 ソース限定・出典付き回答</text>
    
    <circle cx="397" cy="185" r="28" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="397" y="192" text-anchor="middle" fill="#a78bfa" font-size="20">🔍</text>
    
    <text x="397" y="240" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">嘘をつかない厳密な根拠</text>
    <text x="305" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・回答の文末に数字の引用リンク</text>
    <text x="305" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">・クリックで原文の該当箇所へジャンプ</text>
    <text x="305" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">・外部ネット情報を混ぜずに回答</text>
    <text x="397" y="355" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="11">裏技: チェックを外して資料を絞り込み</text>
  </g>

  <!-- Card 3: 複数形式の統合 -->
  <g filter="url(#shadow)">
    <rect x="530" y="105" width="230" height="270" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <rect x="530" y="105" width="230" height="40" rx="12" fill="url(#cardGrad3)"/>
    <text x="645" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">📊 横断メモ＆構成作成</text>
    
    <circle cx="645" cy="185" r="28" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="645" y="192" text-anchor="middle" fill="#34d399" font-size="20">⚡</text>
    
    <text x="645" y="240" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">50ソースを1冊の本に</text>
    <text x="550" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・YouTube動画、PDF、WebURLを</text>
    <text x="550" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">　まとめて1つのノートに統合</text>
    <text x="550" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">・ワンクリックでFAQや年表生成</text>
    <text x="645" y="355" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11">裏技: メモを新規ソースとして再帰活用</text>
  </g>
</svg>
