<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">電子レンジ 重曹スチーム清掃 4ステップガイド</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">重曹のアルカリ性蒸気で油汚れ・焦げつき・においを浮かせて落とす</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="35" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="35" y="105" width="165" height="40" rx="12" fill="url(#stepGrad1)"/>
    <text x="117" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">STEP 1 : 準備</text>
    
    <!-- Icon Cup -->
    <ellipse cx="117" cy="180" rx="25" ry="10" fill="#38bdf8" opacity="0.3"/>
    <rect x="92" y="180" width="50" height="40" rx="5" fill="#38bdf8" opacity="0.2"/>
    <ellipse cx="117" cy="220" rx="25" ry="10" fill="#38bdf8" opacity="0.4"/>
    <path d="M 142 185 Q 160 195 142 210" stroke="#38bdf8" stroke-width="3" fill="none"/>

    <text x="117" y="255" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">重曹水を作る</text>
    <text x="117" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">水 200ml ＋</text>
    <text x="117" y="300" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">重曹 大さじ1杯</text>
    <text x="117" y="320" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11">耐熱容器でよく混ぜる</text>
  </g>

  <!-- Arrow 1-2 -->
  <polygon points="208,222 208,210 220,216" fill="#64748b"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="225" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="225" y="105" width="165" height="40" rx="12" fill="url(#stepGrad2)"/>
    <text x="307" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">STEP 2 : 加熱</text>
    
    <!-- Microwave Icon -->
    <rect x="277" y="170" width="60" height="45" rx="4" fill="#334155" stroke="#f97316" stroke-width="2"/>
    <rect x="283" y="176" width="36" height="33" rx="2" fill="#0f172a"/>
    <circle cx="328" cy="183" r="3" fill="#f97316"/>
    <circle cx="328" cy="195" r="3" fill="#f97316"/>
    <path d="M 293 198 Q 296 186 300 198 Q 303 186 307 198" stroke="#fdba74" stroke-width="2" fill="none"/>

    <text x="307" y="255" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">レンジで約3分</text>
    <text x="307" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">500W〜600Wで加熱</text>
    <text x="307" y="300" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">ラップは不要</text>
    <text x="307" y="320" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="11">蒸気をしっかり発生</text>
  </g>

  <!-- Arrow 2-3 -->
  <polygon points="398,222 398,210 410,216" fill="#64748b"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="415" y="105" width="165" height="235" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <rect x="415" y="105" width="165" height="40" rx="12" fill="url(#stepGrad3)"/>
    <text x="497" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">STEP 3 : 放置</text>
    
    <!-- Clock Icon -->
    <circle cx="497" cy="195" r="24" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <line x1="497" y1="195" x2="497" y2="180" stroke="#10b981" stroke-width="2"/>
    <line x1="497" y1="195" x2="510" y2="195" stroke="#10b981" stroke-width="2"/>

    <text x="497" y="255" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">扉を閉めて15分</text>
    <text x="497" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">開けずに待機</text>
    <text x="497" y="300" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">スチームを行き渡らせ</text>
    <text x="497" y="320" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11">こびりつき汚れを軟化</text>
  </g>

  <!-- Arrow 3-4 -->
  <polygon points="588,222 588,210 600,216" fill="#64748b"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="605" y="105" width="160" height="235" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="605" y="105" width="160" height="40" rx="12" fill="url(#stepGrad4)"/>
    <text x="685" y="131" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">STEP 4 : 拭き取り</text>
    
    <!-- Sparkle / Wipe Icon -->
    <rect x="660" y="175" width="45" height="35" rx="4" fill="#8b5cf6" opacity="0.3" transform="rotate(-15 685 195)"/>
    <circle cx="660" cy="170" r="3" fill="#a78bfa"/>
    <circle cx="710" cy="210" r="4" fill="#a78bfa"/>

    <text x="685" y="255" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">ふきんでスッキリ</text>
    <text x="685" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">温かい重曹水を</text>
    <text x="685" y="300" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">浸した布で拭き掃除</text>
    <text x="685" y="320" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="11">仕上げに乾拭き</text>
  </g>

  <!-- Warning Banner -->
  <text x="400" y="375" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="12">
    ⚠️ 加熱直後の容器は大変熱くなっています。取り出す際は火傷に十分ご注意ください
  </text>
</svg>
