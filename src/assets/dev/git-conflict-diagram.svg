<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="conflictGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title Banner -->
  <text x="380" y="42" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">Git コンフリクト（競合）の仕組みと解決フロー</text>

  <!-- Top Scenario: Why conflict happens -->
  <g transform="translate(30, 70)">
    <rect width="700" height="150" rx="10" fill="#242834" stroke="#333b4d" stroke-width="1"/>
    
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">【原因】同じファイルの同じ行を、2人が同時に変更してマージしようとしたとき発生</text>

    <!-- Branch diagram -->
    <!-- Base commit -->
    <circle cx="80" cy="85" r="14" fill="#64748b"/>
    <text x="80" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">C1</text>
    <text x="80" y="125" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">共通の祖先</text>

    <!-- Branch A (main by teammate) -->
    <line x1="94" y1="85" x2="170" y2="60" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="180" cy="60" r="14" fill="url(#mainGrad)"/>
    <text x="180" y="65" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">C2</text>
    <text x="180" y="38" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="11">仲間の修正: title = "A"</text>

    <!-- Branch B (feature by you) -->
    <line x1="94" y1="85" x2="170" y2="110" stroke="#10b981" stroke-width="3"/>
    <circle cx="180" cy="110" r="14" fill="url(#featureGrad)"/>
    <text x="180" y="115" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">C3</text>
    <text x="180" y="140" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11">自分の修正: title = "B"</text>

    <!-- Arrow to Conflict -->
    <line x1="194" y1="60" x2="310" y2="85" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="194" y1="110" x2="310" y2="85" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Conflict Node -->
    <circle cx="325" cy="85" r="18" fill="url(#conflictGrad)"/>
    <text x="325" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">!</text>
    <text x="325" y="125" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">CONFLICT</text>

    <!-- Conflict editor preview box -->
    <rect x="390" y="15" width="295" height="120" rx="8" fill="#181a20" stroke="#475569" stroke-width="1"/>
    <text x="405" y="35" fill="#38bdf8" font-family="monospace" font-size="11">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (現在の変更: あなた)</text>
    <text x="405" y="55" fill="#4ade80" font-family="monospace" font-size="11">const title = "B";</text>
    <text x="405" y="75" fill="#64748b" font-family="monospace" font-size="11">=======</text>
    <text x="405" y="95" fill="#60a5fa" font-family="monospace" font-size="11">const title = "A";</text>
    <text x="405" y="115" fill="#f43f5e" font-family="monospace" font-size="11">&gt;&gt;&gt;&gt;&gt;&gt;&gt; main (取り込む変更: 仲間)</text>
  </g>

  <!-- Bottom Steps: How to Resolve -->
  <g transform="translate(30, 240)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#242834" stroke="#333b4d" stroke-width="1"/>
    <rect x="12" y="12" width="26" height="26" rx="6" fill="#3b82f6"/>
    <text x="25" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
    <text x="48" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">該当箇所を開いて相談</text>
    <text x="15" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11">VS Code等で競合ファイルを開き、</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">仲間とどちらを残すか、</text>
    <text x="15" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="11">または両方合体させるか決定。</text>
    <text x="15" y="130" fill="#38bdf8" font-family="sans-serif" font-size="11">勝手に消さず確認が基本！</text>

    <!-- Step 2 -->
    <rect x="240" y="0" width="220" height="150" rx="10" fill="#242834" stroke="#333b4d" stroke-width="1"/>
    <rect x="252" y="12" width="26" height="26" rx="6" fill="#10b981"/>
    <text x="265" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">2</text>
    <text x="288" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">記号を消して手動修正</text>
    <text x="255" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11">&lt;&lt;&lt;&lt;&lt;&lt;&lt; や ======= などの</text>
    <text x="255" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">競合マーカー記号を完全に削除し、</text>
    <text x="255" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="11">正しいコードだけを残す。</text>
    <text x="255" y="130" fill="#34d399" font-family="monospace" font-size="11">Accept Current / Incoming</text>

    <!-- Step 3 -->
    <rect x="480" y="0" width="220" height="150" rx="10" fill="#242834" stroke="#333b4d" stroke-width="1"/>
    <rect x="492" y="12" width="26" height="26" rx="6" fill="#8b5cf6"/>
    <text x="505" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
    <text x="528" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">add &amp; コミット完了</text>
    <text x="495" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11">動作確認テストを実行後、</text>
    <text x="495" y="85" fill="#a78bfa" font-family="monospace" font-size="11">git add &lt;ファイル名&gt;</text>
    <text x="495" y="105" fill="#a78bfa" font-family="monospace" font-size="11">git commit -m "fix: conflict"</text>
    <text x="495" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="11">これで解決完了！</text>
  </g>
</svg>
