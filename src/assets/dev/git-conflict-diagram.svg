<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#1f2432"/>
    </linearGradient>
    <linearGradient id="mainGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="featureGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="conflictGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="16" fill="url(#bgGradC)"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold">Git コンフリクト（競合）の仕組みと解決フロー</text>

  <!-- Top Container: Why conflict happens -->
  <g transform="translate(30, 60)">
    <rect width="700" height="190" rx="12" fill="#1b202c" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Header of top container -->
    <rect width="700" height="34" rx="12" fill="#0f172a"/>
    <text x="20" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">【原因】同じファイルの同じ行を、2人が同時に変更してマージしようとした時に発生</text>

    <!-- Branch nodes area (Left side) -->
    <g transform="translate(10, 45)">
      <!-- Base commit C1 -->
      <circle cx="50" cy="65" r="14" fill="#64748b"/>
      <text x="50" y="70" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">C1</text>
      <text x="50" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">共通の祖先</text>

      <!-- Branch A (teammate on main) -->
      <line x1="64" y1="65" x2="140" y2="35" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="150" cy="35" r="14" fill="url(#mainGradC)"/>
      <text x="150" y="40" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">C2</text>
      <text x="150" y="16" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">仲間の修正: title = "A"</text>

      <!-- Branch B (you on feature) -->
      <line x1="64" y1="65" x2="140" y2="95" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="150" cy="95" r="14" fill="url(#featureGradC)"/>
      <text x="150" y="100" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">C3</text>
      <text x="150" y="125" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">自分の修正: title = "B"</text>

      <!-- Merge Lines to Conflict -->
      <line x1="164" y1="35" x2="260" y2="65" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
      <line x1="164" y1="95" x2="260" y2="65" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Conflict Icon -->
      <circle cx="275" cy="65" r="18" fill="url(#conflictGradC)"/>
      <text x="275" y="71" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold">!</text>
      <text x="275" y="102" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">CONFLICT</text>
    </g>

    <!-- Right side: Code editor preview box -->
    <g transform="translate(350, 48)">
      <rect width="335" height="126" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <rect width="335" height="24" rx="8" fill="#1e293b"/>
      <circle cx="15" cy="12" r="4" fill="#ef4444"/>
      <circle cx="28" cy="12" r="4" fill="#f59e0b"/>
      <circle cx="41" cy="12" r="4" fill="#10b981"/>
      <text x="170" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">エディタ内の競合マーカー表示</text>

      <text x="15" y="44" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (現在の変更: 自分)</text>
      <text x="15" y="62" fill="#4ade80" font-family="Consolas, monospace" font-size="11">const title = "B";</text>
      <text x="15" y="80" fill="#64748b" font-family="Consolas, monospace" font-size="11">=======</text>
      <text x="15" y="98" fill="#60a5fa" font-family="Consolas, monospace" font-size="11">const title = "A";</text>
      <text x="15" y="116" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">&gt;&gt;&gt;&gt;&gt;&gt;&gt; main (取り込む変更: 仲間)</text>
    </g>
  </g>

  <!-- Bottom Steps: How to Resolve (3 Cards) -->
  <g transform="translate(30, 270)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="220" height="165" rx="10" fill="#1b202c" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="32" rx="10" fill="#2563eb"/>
    <text x="110" y="21" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">ステップ 1: 該当箇所を開いて相談</text>
    
    <text x="15" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">VS Code等で競合ファイルを開く。</text>
    <text x="15" y="75" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">どちらを残すか、または両方</text>
    <text x="15" y="95" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">合体させるかを仲間と確認。</text>
    
    <rect x="15" y="115" width="190" height="36" rx="6" fill="#0f172a"/>
    <text x="110" y="138" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">勝手に消さず確認が基本！</text>

    <!-- Step 2 -->
    <rect x="240" y="0" width="220" height="165" rx="10" fill="#1b202c" stroke="#10b981" stroke-width="1.5"/>
    <rect x="240" y="0" width="220" height="32" rx="10" fill="#059669"/>
    <text x="350" y="21" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">ステップ 2: 記号を消して手動修正</text>

    <text x="255" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">&lt;&lt;&lt;&lt;&lt;&lt;&lt; や ======= などの</text>
    <text x="255" y="75" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">記号行をすべて綺麗に削除し、</text>
    <text x="255" y="95" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">正しい完成コードだけを残す。</text>

    <rect x="255" y="115" width="190" height="36" rx="6" fill="#0f172a"/>
    <text x="350" y="137" text-anchor="middle" fill="#34d399" font-family="Consolas, monospace" font-size="10">Accept Current / Incoming</text>

    <!-- Step 3 -->
    <rect x="480" y="0" width="220" height="165" rx="10" fill="#1b202c" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="480" y="0" width="220" height="32" rx="10" fill="#7c3aed"/>
    <text x="590" y="21" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">ステップ 3: add ＆ コミット完了</text>

    <text x="495" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">動作確認テストを実行後、</text>
    <text x="495" y="75" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">git add &lt;ファイル名&gt;</text>
    <text x="495" y="95" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">git commit -m "fix: 競合解消"</text>

    <rect x="495" y="115" width="190" height="36" rx="6" fill="#0f172a"/>
    <text x="590" y="138" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">これで無事解決完了！</text>
  </g>
</svg>
