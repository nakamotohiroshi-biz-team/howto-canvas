<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="local1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="remoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Git 基本データフロー（4つの領域）</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">作業ツリーからリモートGitHubへコードが記録・送信される仕組み</text>

  <!-- Area 1: Working Directory -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="155" height="210" rx="12" fill="url(#local1)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="40" y="110" width="155" height="40" rx="12" fill="#334155"/>
    <text x="117" y="136" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">① ワークスペース</text>
    <text x="117" y="170" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">作業ディレクトリ</text>
    
    <rect x="65" y="190" width="105" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="117" y="212" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">コード編集</text>
    
    <text x="117" y="260" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">普段ファイルを</text>
    <text x="117" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">書き換える領域</text>
    <text x="117" y="305" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">git status</text>
  </g>

  <!-- Arrow 1 -> 2: git add -->
  <path d="M 195 200 L 225 200" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="225,196 235,200 225,204" fill="#38bdf8"/>
  <text x="215" y="185" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">git add</text>

  <!-- Area 2: Staging Area -->
  <g filter="url(#shadow)">
    <rect x="235" y="110" width="155" height="210" rx="12" fill="url(#local1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="235" y="110" width="155" height="40" rx="12" fill="url(#stageGrad)"/>
    <text x="312" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">② ステージング</text>
    <text x="312" y="170" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="11">インデックス</text>
    
    <rect x="260" y="190" width="105" height="35" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="312" y="212" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="12">登録完了</text>
    
    <text x="312" y="260" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">コミット対象の</text>
    <text x="312" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">変更を準備する場所</text>
    <text x="312" y="305" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">git diff --staged</text>
  </g>

  <!-- Arrow 2 -> 3: git commit -->
  <path d="M 390 200 L 420 200" stroke="#34d399" stroke-width="3"/>
  <polygon points="420,196 430,200 420,204" fill="#34d399"/>
  <text x="410" y="185" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">commit</text>

  <!-- Area 3: Local Repository -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="155" height="210" rx="12" fill="url(#local1)" stroke="#059669" stroke-width="1.5"/>
    <rect x="430" y="110" width="155" height="40" rx="12" fill="url(#repoGrad)"/>
    <text x="507" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">③ ローカル履歴</text>
    <text x="507" y="170" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11">.git / 本棚</text>
    
    <rect x="455" y="190" width="105" height="35" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="507" y="212" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="12">コミット保存</text>
    
    <text x="507" y="260" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">PC内のGit履歴に</text>
    <text x="507" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">確定記録された状態</text>
    <text x="507" y="305" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">git log</text>
  </g>

  <!-- Arrow 3 -> 4: git push -->
  <path d="M 585 200 L 615 200" stroke="#a78bfa" stroke-width="3"/>
  <polygon points="615,196 625,200 615,204" fill="#a78bfa"/>
  <text x="605" y="185" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">push</text>

  <!-- Area 4: Remote Repository (GitHub) -->
  <g filter="url(#shadow)">
    <rect x="625" y="110" width="145" height="210" rx="12" fill="url(#local1)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="625" y="110" width="145" height="40" rx="12" fill="url(#remoteGrad)"/>
    <text x="697" y="136" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">④ GitHub</text>
    <text x="697" y="170" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="11">クラウド / リモート</text>
    
    <rect x="645" y="190" width="105" height="35" rx="6" fill="#0f172a" stroke="#7c3aed"/>
    <text x="697" y="212" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12">オンライン公開</text>
    
    <text x="697" y="260" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">チーム全員や</text>
    <text x="697" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">世界中と同期共有</text>
    <text x="697" y="305" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">git pull で受信</text>
  </g>

  <!-- Bottom Guide -->
  <text x="400" y="365" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">
    「編集」▶「add（登録）」▶「commit（記録）」▶「push（送信）」の4歩で完了します
  </text>
</svg>
