<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGSG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#261a22"/>
    </linearGradient>
    <linearGradient id="secGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="secGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="secGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="secGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadowGSG" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="440" rx="16" fill="url(#bgGSG)"/>

  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="bold">Git 機密情報漏洩防止と .gitignore 完全レスキューマップ</text>

  <!-- Card 1: 載せてはいけない4大機密 -->
  <g transform="translate(35, 65)" filter="url(#shadowGSG)">
    <rect width="350" height="165" rx="12" fill="#1e1820" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="350" height="34" rx="12" fill="url(#secGrad1)"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">1. 載せてはいけない4大機密</text>

    <text x="16" y="62" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">・APIキー・トークン: ghp_ や gho_ で始まる文字列</text>
    <text x="16" y="85" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">・環境変数ファイル: .env, .env.production</text>
    <text x="16" y="108" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">・秘密鍵・証明書: *.pem, id_rsa, *.pfx</text>
    <text x="16" y="131" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">・個人情報・本番データ: DB接続文字列、顧客CSV</text>
    <text x="16" y="152" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">※ URLに直接トークンを書くのも危険！GCMに委譲！</text>
  </g>

  <!-- Card 2: .gitignore の防御壁 -->
  <g transform="translate(415, 65)" filter="url(#shadowGSG)">
    <rect width="350" height="165" rx="12" fill="#181e24" stroke="#10b981" stroke-width="1.5"/>
    <rect width="350" height="34" rx="12" fill="url(#secGrad2)"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">2. .gitignore による事前防御</text>

    <text x="16" y="58" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11" font-weight="bold">.env* / *.pem / dist/ / node_modules/</text>

    <text x="16" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">リポジトリ直下に配置して追跡を未然に防止。</text>
    
    <rect x="14" y="92" width="322" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="22" y="110" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">【超重要ルール】</text>
    <text x="22" y="126" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">効くのは「未追跡」のみ！追跡済は追加だけでは消えない</text>

    <text x="16" y="150" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">初期設定テンプレートを必ずプロジェクト開始時に用意</text>
  </g>

  <!-- Card 3: 誤コミットの解除 -->
  <g transform="translate(35, 250)" filter="url(#shadowGSG)">
    <rect width="350" height="165" rx="12" fill="#1e1c18" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="350" height="34" rx="12" fill="url(#secGrad3)"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">3. 誤コミット後の追跡解除（push前）</text>

    <text x="16" y="60" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">手元ファイルを残したままGit管理から外す手順:</text>

    <rect x="14" y="70" width="322" height="38" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="22" y="87" fill="#fcd34d" font-family="Consolas, monospace" font-size="11">git rm --cached .env</text>
    <text x="22" y="101" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">git commit -m "chore: remove .env from tracking"</text>

    <text x="16" y="128" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">その後 .gitignore に忘れず追記してコミット！</text>
    <text x="16" y="148" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PC上の実ファイルは消えない安全なコマンド</text>
  </g>

  <!-- Card 4: push後の緊急レスキュー -->
  <g transform="translate(415, 250)" filter="url(#shadowGSG)">
    <rect width="350" height="165" rx="12" fill="#1b1824" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="350" height="34" rx="12" fill="url(#secGrad4)"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">4. pushしてしまった時の初動対応</text>

    <text x="16" y="62" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">最優先: トークンを即座に失効（Revoke）！</text>
    <text x="16" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">コミットを消す前に、管理画面から無効化・再発行</text>

    <text x="16" y="106" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">履歴から完全抹消: git-filter-repo ツール</text>
    <text x="16" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">過去のコミット履歴全体から機密ファイルを完全消去</text>

    <text x="16" y="148" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">「流出した鍵はすべて無効化する」がセキュリティ鉄則</text>
  </g>
</svg>
