<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUndo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#1f2432"/>
    </linearGradient>
    <linearGradient id="stashGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="resetGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="revertGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amendGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadowUndo" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" rx="16" fill="url(#bgUndo)"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold">Git「やらかした！」時の4大レスキュー早見表</text>

  <!-- Grid 2x2 cards -->

  <!-- Card 1: git stash -->
  <g transform="translate(35, 65)" filter="url(#shadowUndo)">
    <rect width="335" height="165" rx="12" fill="#1b202c" stroke="#eab308" stroke-width="1.5"/>
    <rect width="335" height="34" rx="12" fill="url(#stashGradU)"/>
    <text x="167" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">1. 作業中なのに別の仕事を頼まれた時</text>
    
    <text x="18" y="62" fill="#fde047" font-family="Consolas, monospace" font-size="13" font-weight="bold">git stash</text>
    <text x="18" y="85" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">作業中の変更を一時退避して作業部屋を綺麗にする</text>

    <text x="18" y="118" fill="#fde047" font-family="Consolas, monospace" font-size="13" font-weight="bold">git stash pop</text>
    <text x="18" y="140" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">別件終了後、預けた変更を取り出して作業再開！</text>
  </g>

  <!-- Card 2: git commit amend -->
  <g transform="translate(390, 65)" filter="url(#shadowUndo)">
    <rect width="335" height="165" rx="12" fill="#1b202c" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="335" height="34" rx="12" fill="url(#amendGradU)"/>
    <text x="167" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">2. 直前のコミット文やファイルを直したい時</text>
    
    <text x="18" y="62" fill="#67e8f9" font-family="Consolas, monospace" font-size="12" font-weight="bold">git commit --amend -m "新メッセージ"</text>
    <text x="18" y="85" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">直前のコミットメッセージを上書き修正できる</text>

    <text x="18" y="118" fill="#67e8f9" font-family="Consolas, monospace" font-size="12" font-weight="bold">git add file &amp;&amp; git commit --amend</text>
    <text x="18" y="140" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">コミットし忘れたファイルを直前のコミットに合体</text>
  </g>

  <!-- Card 3: git restore / reset -->
  <g transform="translate(35, 250)" filter="url(#shadowUndo)">
    <rect width="335" height="165" rx="12" fill="#1b202c" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="335" height="34" rx="12" fill="url(#resetGradU)"/>
    <text x="167" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">3. 変更を捨てたい・ステージングを外したい時</text>
    
    <text x="18" y="62" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="bold">git restore &lt;ファイル名&gt;</text>
    <text x="18" y="85" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">未コミットの編集内容を完全に破棄して元通りに戻す</text>

    <text x="18" y="118" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="bold">git restore --staged &lt;ファイル名&gt;</text>
    <text x="18" y="140" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">誤って add したファイルを撮影台から降ろす（安全）</text>
  </g>

  <!-- Card 4: git revert -->
  <g transform="translate(390, 250)" filter="url(#shadowUndo)">
    <rect width="335" height="165" rx="12" fill="#1b202c" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="335" height="34" rx="12" fill="url(#revertGradU)"/>
    <text x="167" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">4. 共有済みリモートコミットを取り消す時</text>
    
    <text x="18" y="62" fill="#d8b4fe" font-family="Consolas, monospace" font-size="12" font-weight="bold">git revert &lt;コミットID&gt;</text>
    <text x="18" y="85" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">過去のコミットの「逆の変更」を行う新コミットを生成</text>

    <text x="18" y="118" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">【チーム開発の最重要ルール】</text>
    <text x="18" y="140" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">push済みの履歴は reset で消さず revert で安全に打消！</text>
  </g>
</svg>
