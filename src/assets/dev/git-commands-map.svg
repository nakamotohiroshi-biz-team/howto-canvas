<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Git & GitHub 主要コマンド体系マップ</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">日常の開発フローで頻出するコマンドを用途別に整理</text>

  <!-- Card 1: 準備・確認 -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="345" height="140" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="125" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="bold">1. 準備・状況確認</text>
    <text x="60" y="155" fill="#e2e8f0" font-family="monospace" font-size="13">git status</text>
    <text x="180" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">変更状態の確認</text>
    <text x="60" y="180" fill="#e2e8f0" font-family="monospace" font-size="13">git diff</text>
    <text x="180" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">変更差分の詳細表示</text>
    <text x="60" y="205" fill="#e2e8f0" font-family="monospace" font-size="13">git log --oneline</text>
    <text x="210" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12">コミット履歴を1行表示</text>
  </g>

  <!-- Card 2: 保存・記録 -->
  <g filter="url(#shadow)">
    <rect x="415" y="95" width="345" height="140" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="125" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold">2. 記録・同期</text>
    <text x="435" y="155" fill="#e2e8f0" font-family="monospace" font-size="13">git add -A</text>
    <text x="560" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">全変更をステージング</text>
    <text x="435" y="180" fill="#e2e8f0" font-family="monospace" font-size="13">git commit -m "..."</text>
    <text x="600" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">変更内容を記録</text>
    <text x="435" y="205" fill="#e2e8f0" font-family="monospace" font-size="13">git push / git pull</text>
    <text x="600" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12">リモートと送受信</text>
  </g>

  <!-- Card 3: ブランチ操作 -->
  <g filter="url(#shadow)">
    <rect x="40" y="255" width="345" height="140" rx="10" fill="url(#cardGrad3)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="285" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="bold">3. ブランチ操作</text>
    <text x="60" y="315" fill="#e2e8f0" font-family="monospace" font-size="13">git branch -a</text>
    <text x="180" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">全ブランチの一覧</text>
    <text x="60" y="340" fill="#e2e8f0" font-family="monospace" font-size="13">git switch -c &lt;name&gt;</text>
    <text x="210" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">新ブランチ作成＆移動</text>
    <text x="60" y="365" fill="#e2e8f0" font-family="monospace" font-size="13">git merge &lt;branch&gt;</text>
    <text x="210" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">ブランチの合流</text>
  </g>

  <!-- Card 4: 困ったときの復元・退避 -->
  <g filter="url(#shadow)">
    <rect x="415" y="255" width="345" height="140" rx="10" fill="url(#cardGrad4)" stroke="#f97316" stroke-width="1.5"/>
    <text x="435" y="285" fill="#fb923c" font-family="sans-serif" font-size="15" font-weight="bold">4. 退避・取り消し</text>
    <text x="435" y="315" fill="#e2e8f0" font-family="monospace" font-size="13">git stash</text>
    <text x="560" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">作業の一時退避</text>
    <text x="435" y="340" fill="#e2e8f0" font-family="monospace" font-size="13">git stash pop</text>
    <text x="560" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">退避した作業を復元</text>
    <text x="435" y="365" fill="#e2e8f0" font-family="monospace" font-size="13">git restore &lt;file&gt;</text>
    <text x="585" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">作業前の状態に戻す</text>
  </g>
</svg>
