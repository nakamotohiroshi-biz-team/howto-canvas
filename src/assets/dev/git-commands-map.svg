<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCmd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="shadowCmd" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="16" fill="url(#bgCmd)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold">Git ＆ GitHub 主要コマンド体系マップ</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">日常の開発フローで頻出するコマンドを用途別に整理</text>

  <!-- Card 1: 準備・確認 -->
  <g filter="url(#shadowCmd)">
    <rect x="40" y="95" width="345" height="150" rx="10" fill="url(#card1Grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="95" width="345" height="34" rx="10" fill="#2563eb"/>
    <text x="60" y="118" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">1. 準備・状況確認</text>
    
    <text x="60" y="156" fill="#67e8f9" font-family="Consolas, monospace" font-size="13" font-weight="bold">git status</text>
    <text x="180" y="156" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">変更状態・ブランチの確認</text>

    <text x="60" y="186" fill="#67e8f9" font-family="Consolas, monospace" font-size="13" font-weight="bold">git diff</text>
    <text x="180" y="186" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">未ステージの変更差分表示</text>

    <text x="60" y="216" fill="#67e8f9" font-family="Consolas, monospace" font-size="13" font-weight="bold">git log --oneline</text>
    <text x="210" y="216" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">過去の履歴を1行ずつ表示</text>
  </g>

  <!-- Card 2: 保存・記録 -->
  <g filter="url(#shadowCmd)">
    <rect x="415" y="95" width="345" height="150" rx="10" fill="url(#card2Grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="415" y="95" width="345" height="34" rx="10" fill="#059669"/>
    <text x="435" y="118" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">2. 記録・同期</text>

    <text x="435" y="156" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="bold">git add -A</text>
    <text x="560" y="156" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">全変更をステージング</text>

    <text x="435" y="186" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="bold">git commit -m "..."</text>
    <text x="600" y="186" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">変更内容を記録保存</text>

    <text x="435" y="216" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="bold">git push / pull</text>
    <text x="600" y="216" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">GitHubと送受信同期</text>
  </g>

  <!-- Card 3: ブランチ操作 -->
  <g filter="url(#shadowCmd)">
    <rect x="40" y="265" width="345" height="150" rx="10" fill="url(#card3Grad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="40" y="265" width="345" height="34" rx="10" fill="#7c3aed"/>
    <text x="60" y="288" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">3. ブランチ操作</text>

    <text x="60" y="326" fill="#d8b4fe" font-family="Consolas, monospace" font-size="13" font-weight="bold">git branch</text>
    <text x="180" y="326" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ブランチ一覧の確認</text>

    <text x="60" y="356" fill="#d8b4fe" font-family="Consolas, monospace" font-size="13" font-weight="bold">git switch -c &lt;name&gt;</text>
    <text x="225" y="356" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">新ブランチ作成＆移動</text>

    <text x="60" y="386" fill="#d8b4fe" font-family="Consolas, monospace" font-size="13" font-weight="bold">git switch main</text>
    <text x="225" y="386" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">メインブランチへ戻る</text>
  </g>

  <!-- Card 4: 困ったときの復元・退避 -->
  <g filter="url(#shadowCmd)">
    <rect x="415" y="265" width="345" height="150" rx="10" fill="url(#card4Grad)" stroke="#f97316" stroke-width="1.5"/>
    <rect x="415" y="265" width="345" height="34" rx="10" fill="#c2410c"/>
    <text x="435" y="288" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">4. 退避・取り消し</text>

    <text x="435" y="326" fill="#fdba74" font-family="Consolas, monospace" font-size="13" font-weight="bold">git stash</text>
    <text x="560" y="326" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">書きかけ作業の一時退避</text>

    <text x="435" y="356" fill="#fdba74" font-family="Consolas, monospace" font-size="13" font-weight="bold">git stash pop</text>
    <text x="560" y="356" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">退避した作業を復元再開</text>

    <text x="435" y="386" fill="#fdba74" font-family="Consolas, monospace" font-size="13" font-weight="bold">git restore &lt;file&gt;</text>
    <text x="585" y="386" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">作業前の状態に戻す</text>
  </g>
</svg>
