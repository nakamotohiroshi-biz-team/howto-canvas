<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#1f2432"/>
    </linearGradient>
    <linearGradient id="mainLineG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="featureLineG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="16" fill="url(#bgGradBS)"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold">チーム開発の標準モデル：GitHub Flow と ブランチ保護</text>

  <!-- Top Flow Area -->
  <g transform="translate(40, 60)">
    <!-- Main branch bar -->
    <rect x="0" y="150" width="680" height="6" rx="3" fill="url(#mainLineG)"/>
    <text x="10" y="140" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">main ブランチ（常にデプロイ可能な本番安定版）</text>

    <!-- Branch Protection Badge (No Emoji, Pure Vector / Clean Tag) -->
    <g transform="translate(430, 115)">
      <rect width="240" height="26" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Small Lock Icon Path -->
      <path d="M 18 17 L 18 13 C 18 10 24 10 24 13 L 24 17 Z" fill="none" stroke="#fef08a" stroke-width="1.5"/>
      <rect x="15" y="16" width="12" height="8" rx="2" fill="#f59e0b"/>
      <text x="135" y="18" text-anchor="middle" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">保護ルール: 直接Push禁止 ＆ PR必須</text>
    </g>

    <!-- Main line nodes -->
    <circle cx="50" cy="153" r="12" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <text x="50" y="180" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">分岐元</text>

    <circle cx="180" cy="153" r="8" fill="#3b82f6"/>
    
    <!-- Feature Branch Arc -->
    <path d="M 50 153 C 80 50, 110 50, 150 50 L 460 50 C 500 50, 520 153, 530 153" fill="none" stroke="url(#featureLineG)" stroke-width="3.5"/>
    <text x="160" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">feature/user-auth（作業用ブランチ）</text>

    <!-- Feature commits -->
    <circle cx="210" cy="50" r="9" fill="#10b981"/>
    <text x="210" y="75" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">コミット 1</text>

    <circle cx="310" cy="50" r="9" fill="#10b981"/>
    <text x="310" y="75" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">コミット 2</text>

    <!-- PR / Review Box -->
    <g transform="translate(370, 15)">
      <rect width="130" height="44" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="18" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">プルリクエスト作成</text>
      <text x="65" y="34" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">CIテスト通過 ＆ 承認</text>
    </g>

    <!-- Merge node on main -->
    <circle cx="530" cy="153" r="14" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2.5"/>
    <text x="530" y="182" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">マージ完了</text>

    <!-- Release Tag node -->
    <circle cx="640" cy="153" r="12" fill="#2563eb" stroke="#bfdbfe" stroke-width="2.5"/>
    <text x="640" y="182" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">v1.2.0 タグ</text>
  </g>

  <!-- Bottom: 3 Core Rules of GitHub Flow -->
  <g transform="translate(40, 280)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="215" height="150" rx="10" fill="#1b202c" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="215" height="30" rx="10" fill="#1e3a8a"/>
    <text x="15" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">1. mainは常に安定版</text>

    <text x="15" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">未完成コードの混入を防ぐため、</text>
    <text x="15" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">mainへの直接プッシュは禁止。</text>
    <text x="15" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">いつでも本番へデプロイできる</text>
    <text x="15" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">最高品質をチームで維持します。</text>

    <!-- Box 2 -->
    <rect x="232" y="0" width="215" height="150" rx="10" fill="#1b202c" stroke="#334155" stroke-width="1"/>
    <rect x="232" y="0" width="215" height="30" rx="10" fill="#064e3b"/>
    <text x="247" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">2. 作業は必ずブランチで</text>

    <text x="247" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">新機能や修正のたびに、</text>
    <text x="247" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">わかりやすい名前の作業ブランチを作成。</text>
    <text x="247" y="94" fill="#34d399" font-family="Consolas, monospace" font-size="11">git switch -c feature/...</text>
    <text x="247" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">個人部屋で安全に試行錯誤できます。</text>

    <!-- Box 3 -->
    <rect x="465" y="0" width="215" height="150" rx="10" fill="#1b202c" stroke="#334155" stroke-width="1"/>
    <rect x="465" y="0" width="215" height="30" rx="10" fill="#581c87"/>
    <text x="480" y="20" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">3. PRで合流 ＆ 即削除</text>

    <text x="480" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">GitHub上でプルリクエストを作成し、</text>
    <text x="480" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">仲間のレビューと自動テストを通過。</text>
    <text x="480" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">マージされたら古いブランチは削除し、</text>
    <text x="480" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">リポジトリを常に清潔に保ちます。</text>
  </g>
</svg>
