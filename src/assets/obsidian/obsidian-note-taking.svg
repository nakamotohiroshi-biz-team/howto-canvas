<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="g_gray" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient><linearGradient id="g_purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient><linearGradient id="g_blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient><linearGradient id="g_orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#ea580c"/></linearGradient><linearGradient id="g_green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="g_teal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>
<text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">校務のメモの取り方 ― 書く・整える・見返す</text>
<text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">速く残して、翌日までに整え、週に1回見返すと、あとで使えるメモになる</text>
<g filter="url(#shadow)">
<rect x="30.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
<rect x="30.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_blue)"/>
<text x="140.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1. 書く</text>
<text x="140.0" y="178" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">まず速く残す</text>
<text x="46.0" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">・決まったこと</text>
<text x="46.0" y="244" fill="#94a3b8" font-family="sans-serif" font-size="11">・ToDo（誰が・いつまで）</text>
<text x="46.0" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・次の予定</text>
</g>
<polygon points="265.0,226.0 265.0,214.0 277.0,220.0" fill="#64748b"/>
<g filter="url(#shadow)">
<rect x="290.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
<rect x="290.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_orange)"/>
<text x="400.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">2. 整える</text>
<text x="400.0" y="178" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">日付とタイトル</text>
<text x="306.0" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">・2026-11-03 話題</text>
<text x="306.0" y="244" fill="#94a3b8" font-family="sans-serif" font-size="11">・事実と私見を分ける</text>
<text x="306.0" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・[[リンク]]でつなぐ</text>
</g>
<polygon points="525.0,226.0 525.0,214.0 537.0,220.0" fill="#64748b"/>
<g filter="url(#shadow)">
<rect x="550.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<rect x="550.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_green)"/>
<text x="660.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">3. 見返す</text>
<text x="660.0" y="178" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">週に1回5分</text>
<text x="566.0" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">・残りのToDoを確認</text>
<text x="566.0" y="244" fill="#94a3b8" font-family="sans-serif" font-size="11">・受信箱を整理</text>
<text x="566.0" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">・次の準備に使う</text>
</g>
<text x="400" y="385" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="12">ポイント: 個人情報・パスワードは書かない。迷ったら書かない</text>
</svg>
