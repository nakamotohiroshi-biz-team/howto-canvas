<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="g_gray" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient><linearGradient id="g_purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient><linearGradient id="g_blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient><linearGradient id="g_orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#ea580c"/></linearGradient><linearGradient id="g_green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="g_teal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>
<text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Obsidian とは ― メモを「つなげて育てる」ノートアプリ</text>
<text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14">ノートはパソコン内の Markdown ファイル。リンクでつなぐほど、探しやすく、使いやすくなる</text>
<g filter="url(#shadow)">
<rect x="30.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
<rect x="30.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_gray)"/>
<text x="140.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">あなたのメモ</text>
<text x="140.0" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">ボールト（フォルダ）</text>
<text x="46.0" y="222" fill="#e2e8f0" font-family="sans-serif" font-size="13">・中身は .md のファイル</text>
<text x="46.0" y="252" fill="#e2e8f0" font-family="sans-serif" font-size="13">・パソコン内に保存される</text>
<text x="46.0" y="282" fill="#e2e8f0" font-family="sans-serif" font-size="13">・アプリがなくても読める</text>
</g>
<polygon points="265.0,226.0 265.0,214.0 277.0,220.0" fill="#64748b"/>
<g filter="url(#shadow)">
<rect x="290.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<rect x="290.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_purple)"/>
<text x="400.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Obsidian</text>
<text x="400.0" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">メモをつなげる</text>
<text x="306.0" y="222" fill="#e2e8f0" font-family="sans-serif" font-size="13">・[[リンク]]で関連づけ</text>
<text x="306.0" y="252" fill="#e2e8f0" font-family="sans-serif" font-size="13">・バックリンクで逆引き</text>
<text x="306.0" y="282" fill="#e2e8f0" font-family="sans-serif" font-size="13">・グラフで全体を見渡す</text>
<text x="306.0" y="312" fill="#e2e8f0" font-family="sans-serif" font-size="13">・検索ですぐ見つかる</text>
</g>
<polygon points="525.0,226.0 525.0,214.0 537.0,220.0" fill="#64748b"/>
<g filter="url(#shadow)">
<rect x="550.0" y="100" width="220.0" height="240" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
<rect x="550.0" y="100" width="220.0" height="40" rx="12" fill="url(#g_green)"/>
<text x="660.0" y="126" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">便利になること</text>
<text x="660.0" y="180" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="bold">探せる・育つ</text>
<text x="566.0" y="222" fill="#e2e8f0" font-family="sans-serif" font-size="13">・過去のメモが見つかる</text>
<text x="566.0" y="252" fill="#e2e8f0" font-family="sans-serif" font-size="13">・メモ同士が結びつく</text>
<text x="566.0" y="282" fill="#e2e8f0" font-family="sans-serif" font-size="13">・AIにも読ませやすい</text>
</g>
<text x="400" y="385" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="13">ポイント: メモは「ただのファイル」。特別な形式に閉じ込められません</text>
</svg>
