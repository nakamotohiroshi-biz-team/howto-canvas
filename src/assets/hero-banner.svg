<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Central Canvas Board Graphic -->
  <g filter="url(#heroShadow)">
    <!-- Main Slate -->
    <rect x="60" y="60" width="480" height="360" rx="20" fill="url(#boxGrad1)" stroke="url(#glowGrad)" stroke-width="2.5"/>
    
    <!-- Top Bar -->
    <rect x="60" y="60" width="480" height="45" rx="20" fill="#1e293b"/>
    <circle cx="95" cy="82" r="6" fill="#ef4444"/>
    <circle cx="115" cy="82" r="6" fill="#f59e0b"/>
    <circle cx="135" cy="82" r="6" fill="#10b981"/>
    <text x="300" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">HowTo Canvas Knowledge Hub</text>

    <!-- Mini Cards Grid on Canvas -->
    <!-- Card 1: AI -->
    <rect x="90" y="130" width="195" height="110" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="120" cy="160" r="14" fill="#6366f1"/>
    <text x="120" y="165" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">🤖</text>
    <text x="145" y="165" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="bold">AI ツール</text>
    <text x="105" y="195" fill="#a5b4fc" font-family="sans-serif" font-size="11">Claude / Gemini / MCP</text>
    <text x="105" y="215" fill="#6366f1" font-family="sans-serif" font-size="10">自律エージェント設定手順</text>

    <!-- Card 2: Dev -->
    <rect x="315" y="130" width="195" height="110" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="345" cy="160" r="14" fill="#10b981"/>
    <text x="345" y="165" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">⚡</text>
    <text x="370" y="165" fill="#d1fae5" font-family="sans-serif" font-size="13" font-weight="bold">開発・コード</text>
    <text x="330" y="195" fill="#6ee7b7" font-family="sans-serif" font-size="11">Git / GitHub / チーム開発</text>
    <text x="330" y="215" fill="#059669" font-family="sans-serif" font-size="10">コマンド体系チートシート</text>

    <!-- Card 3: Appliances -->
    <rect x="90" y="260" width="420" height="120" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="125" cy="295" r="16" fill="#f59e0b"/>
    <text x="125" y="301" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16">🍳</text>
    <text x="155" y="301" fill="#fef3c7" font-family="sans-serif" font-size="14" font-weight="bold">家電・実機のお手入れ</text>
    <text x="155" y="325" fill="#fde68a" font-family="sans-serif" font-size="12">電子レンジ・エアコン等の清掃＆メンテナンス手順</text>
    <text x="155" y="348" fill="#d97706" font-family="sans-serif" font-size="11">スチーム軟化・安全チェックリスト付き</text>
  </g>
</svg>
