<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Central Canvas Board Graphic -->
  <g filter="url(#heroShadow)">
    <!-- Main Slate -->
    <rect x="60" y="60" width="480" height="380" rx="20" fill="url(#boxGrad1)" stroke="url(#glowGrad)" stroke-width="2.5"/>
    
    <!-- Top Bar -->
    <rect x="60" y="60" width="480" height="45" rx="20" fill="#1e293b"/>
    <circle cx="95" cy="82" r="6" fill="#ef4444"/>
    <circle cx="115" cy="82" r="6" fill="#f59e0b"/>
    <circle cx="135" cy="82" r="6" fill="#10b981"/>
    <text x="300" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">HowTo Canvas Knowledge Hub</text>

    <!-- Mini Cards Grid on Canvas (2-Column Focus) -->
    <!-- Card 1: AI Tools -->
    <rect x="90" y="130" width="195" height="230" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="187" cy="175" r="24" fill="#4338ca"/>
    <text x="187" y="182" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20">🤖</text>
    <text x="187" y="225" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="16" font-weight="bold">AI ツールの使い方</text>
    
    <text x="110" y="260" fill="#a5b4fc" font-family="sans-serif" font-size="12">・Gemini &amp; Claude 活用法</text>
    <text x="110" y="285" fill="#a5b4fc" font-family="sans-serif" font-size="12">・MCP サーバー接続手順</text>
    <text x="110" y="310" fill="#a5b4fc" font-family="sans-serif" font-size="12">・NotebookLM 裏技テクニック</text>
    <text x="110" y="335" fill="#a5b4fc" font-family="sans-serif" font-size="12">・自律型 Claude Code ガイド</text>

    <!-- Card 2: Dev & Engineering -->
    <rect x="315" y="130" width="195" height="230" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="412" cy="175" r="24" fill="#047857"/>
    <text x="412" y="182" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20">⚡</text>
    <text x="412" y="225" text-anchor="middle" fill="#d1fae5" font-family="sans-serif" font-size="16" font-weight="bold">開発・コード</text>
    
    <text x="335" y="260" fill="#6ee7b7" font-family="sans-serif" font-size="12">・Git 基本データフロー</text>
    <text x="335" y="285" fill="#6ee7b7" font-family="sans-serif" font-size="12">・GitHub チーム開発 PR運用</text>
    <text x="335" y="310" fill="#6ee7b7" font-family="sans-serif" font-size="12">・日常コマンドチートシート</text>
    <text x="335" y="335" fill="#6ee7b7" font-family="sans-serif" font-size="12">・ブランチ保護と安全なマージ</text>

    <!-- Bottom Footer Tagline on Board -->
    <text x="300" y="405" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">
      AIと開発ツールの実践ナレッジを直感的な図解で整理
    </text>
  </g>
</svg>
