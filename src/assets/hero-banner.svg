<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Model Gradients -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="nlmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Central Slate Frame -->
  <g filter="url(#heroShadow)">
    <rect x="40" y="40" width="560" height="400" rx="20" fill="url(#boxGrad)" stroke="url(#glowGrad)" stroke-width="2"/>
    
    <!-- Slate Top Navigation -->
    <rect x="40" y="40" width="560" height="42" rx="20" fill="#1e293b"/>
    <circle cx="70" cy="61" r="5" fill="#ef4444"/>
    <circle cx="86" cy="61" r="5" fill="#f59e0b"/>
    <circle cx="102" cy="61" r="5" fill="#10b981"/>
    <text x="320" y="66" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">AI Knowledge Hub ｜ HowTo Canvas</text>

    <!-- 2x2 AI Model Grid -->

    <!-- Card 1: Claude -->
    <g>
      <rect x="70" y="105" width="235" height="140" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.2"/>
      <rect x="70" y="105" width="235" height="34" rx="12" fill="url(#claudeGrad)"/>
      <text x="187" y="127" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Claude (Anthropic)</text>
      
      <circle cx="100" cy="175" r="16" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
      <text x="100" y="181" text-anchor="middle" fill="#fb923c" font-size="14">🧠</text>
      <text x="125" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Claude Code &amp; Artifacts</text>
      <text x="125" y="185" fill="#94a3b8" font-family="sans-serif" font-size="10">自律エージェントCLI</text>
      <text x="125" y="202" fill="#94a3b8" font-family="sans-serif" font-size="10">文字起こし高精度議事録整形</text>
      <text x="125" y="220" fill="#fb923c" font-family="sans-serif" font-size="10">XMLタグ・逆質問テクニック</text>
    </g>

    <!-- Card 2: Gemini -->
    <g>
      <rect x="335" y="105" width="235" height="140" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <rect x="335" y="105" width="235" height="34" rx="12" fill="url(#geminiGrad)"/>
      <text x="452" y="127" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Gemini (Google)</text>
      
      <circle cx="365" cy="175" r="16" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="365" y="181" text-anchor="middle" fill="#60a5fa" font-size="14">✨</text>
      <text x="390" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">200万トークン解析</text>
      <text x="390" y="185" fill="#94a3b8" font-family="sans-serif" font-size="10">1時間の長尺動画・音声を即読</text>
      <text x="390" y="202" fill="#94a3b8" font-family="sans-serif" font-size="10">@Google Drive / Gmail 連携</text>
      <text x="390" y="220" fill="#60a5fa" font-family="sans-serif" font-size="10">Canvasによるリアルタイム共同推敲</text>
    </g>

    <!-- Card 3: NotebookLM -->
    <g>
      <rect x="70" y="265" width="235" height="140" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
      <rect x="70" y="265" width="235" height="34" rx="12" fill="url(#nlmGrad)"/>
      <text x="187" y="287" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">NotebookLM (Google)</text>
      
      <circle cx="100" cy="335" r="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="100" y="341" text-anchor="middle" fill="#34d399" font-size="14">🎙️</text>
      <text x="125" y="325" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">音声から文字起こし・議事録</text>
      <text x="125" y="345" fill="#94a3b8" font-family="sans-serif" font-size="10">会議音声をドラッグ＆ドロップ</text>
      <text x="125" y="362" fill="#94a3b8" font-family="sans-serif" font-size="10">出典ハイライト付き回答</text>
      <text x="125" y="380" fill="#34d399" font-family="sans-serif" font-size="10">音声ポッドキャスト対談生成</text>
    </g>

    <!-- Card 4: MCP Protocol -->
    <g>
      <rect x="335" y="265" width="235" height="140" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <rect x="335" y="265" width="235" height="34" rx="12" fill="url(#mcpGrad)"/>
      <text x="452" y="287" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">MCP（共通プロトコル）</text>
      
      <circle cx="365" cy="335" r="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="365" y="341" text-anchor="middle" fill="#c084fc" font-size="14">🔌</text>
      <text x="390" y="325" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Model Context Protocol</text>
      <text x="390" y="345" fill="#94a3b8" font-family="sans-serif" font-size="10">AIと外部ツールをつなぐUSB-C規格</text>
      <text x="390" y="362" fill="#94a3b8" font-family="sans-serif" font-size="10">Claude Desktop / Gemini 共通化</text>
      <text x="390" y="380" fill="#c084fc" font-family="sans-serif" font-size="10">GitHub・DB・Filesystem即時接続</text>
    </g>

    <!-- Central Connecting Emblem -->
    <circle cx="320" cy="255" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
    <text x="320" y="261" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold">AI</text>
  </g>
</svg>
