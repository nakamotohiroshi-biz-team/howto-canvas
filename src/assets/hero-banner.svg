<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="700" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Top Slate Bar -->
  <rect x="35" y="30" width="630" height="40" rx="12" fill="#1e293b"/>
  <circle cx="60" cy="50" r="5" fill="#ef4444"/>
  <circle cx="76" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="92" cy="50" r="5" fill="#10b981"/>
  <text x="350" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">HowTo Canvas ｜ AI ＆ 開発ナレッジハブ</text>

  <!-- 4 Category Cards Grid (2x2) -->

  <!-- Card 1: Claude -->
  <g filter="url(#shadow)">
    <rect x="55" y="90" width="280" height="160" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="55" y="90" width="280" height="34" rx="12" fill="url(#claudeGrad)"/>
    <text x="195" y="112" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">1. Claude</text>
    
    <text x="75" y="150" fill="#fb923c" font-family="sans-serif" font-size="12" font-weight="bold">・最新裏技大全 / Think harder</text>
    <text x="75" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11">・自律型 Claude Code ガイド</text>
    <text x="75" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="11">・文字起こし高精度議事録整形</text>
    <text x="75" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10">Artifacts即席アプリ・Projects固定</text>
  </g>

  <!-- Card 2: Gemini -->
  <g filter="url(#shadow)">
    <rect x="365" y="90" width="280" height="160" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="365" y="90" width="280" height="34" rx="12" fill="url(#geminiGrad)"/>
    <text x="505" y="112" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">2. Gemini</text>
    
    <text x="385" y="150" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">・最新裏技大全 / Deep Research</text>
    <text x="385" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11">・Canvas リアルタイム共同推敲</text>
    <text x="385" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="11">・スプレッドシート =AI() 関数</text>
    <text x="385" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10">200万トークン動画音声解析・Gemini Live</text>
  </g>

  <!-- Card 3: Gemini Notebook -->
  <g filter="url(#shadow)">
    <rect x="55" y="270" width="280" height="160" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <rect x="55" y="270" width="280" height="34" rx="12" fill="url(#notebookGrad)"/>
    <text x="195" y="292" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">3. Gemini Notebook (NotebookLM)</text>
    
    <text x="75" y="330" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">・音声から文字起こし＆議事録</text>
    <text x="75" y="355" fill="#e2e8f0" font-family="sans-serif" font-size="11">・ハルシネーションゼロの出典回答</text>
    <text x="75" y="380" fill="#e2e8f0" font-family="sans-serif" font-size="11">・音声ポッドキャスト対談生成</text>
    <text x="75" y="405" fill="#94a3b8" font-family="sans-serif" font-size="10">会議録音をドラッグ＆ドロップで一発作成</text>
  </g>

  <!-- Card 4: 開発・エンジニアリング -->
  <g filter="url(#shadow)">
    <rect x="365" y="270" width="280" height="160" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="365" y="270" width="280" height="34" rx="12" fill="url(#devGrad)"/>
    <text x="505" y="292" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">4. 開発・エンジニアリング</text>
    
    <text x="385" y="330" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">・Git 基本データフロー4領域</text>
    <text x="385" y="355" fill="#e2e8f0" font-family="sans-serif" font-size="11">・GitHub チーム開発＆プルリク運用</text>
    <text x="385" y="380" fill="#e2e8f0" font-family="sans-serif" font-size="11">・日常コマンド早見表チートシート</text>
    <text x="385" y="405" fill="#94a3b8" font-family="sans-serif" font-size="10">ブランチ作成からレビュー・安全なマージ</text>
  </g>
</svg>
