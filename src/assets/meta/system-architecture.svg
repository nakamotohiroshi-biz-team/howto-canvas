<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151720"/>
      <stop offset="100%" stop-color="#1f2333"/>
    </linearGradient>
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="contentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="420" rx="16" fill="url(#bgGradA)"/>

  <!-- Title -->
  <text x="380" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold">HowTo Canvas サイト設計書：システム＆情報アーキテクチャ</text>

  <!-- Layer 1: Core Framework (Astro + Starlight) -->
  <g transform="translate(35, 65)">
    <rect width="690" height="90" rx="10" fill="#202535" stroke="#f97316" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="url(#astroGrad)"/>
    <text x="90" y="19" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">1. 基盤フレームワーク層</text>

    <text x="20" y="52" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Astro v5 ＋ Starlight ドキュメンテーションエンジン</text>
    <text x="20" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">・ゼロJSデフォルトによる超高速表示　・静的HTML生成（SSG）　・クライアント側Pagefind日本語全文検索</text>

    <!-- Mini badges -->
    <rect x="520" y="15" width="150" height="24" rx="6" fill="#0f172a"/>
    <text x="595" y="31" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="10">base: /howto-canvas</text>
  </g>

  <!-- Layer 2: Information Architecture & Content Models -->
  <g transform="translate(35, 170)">
    <rect width="690" height="120" rx="10" fill="#202535" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="url(#contentGrad)"/>
    <text x="90" y="19" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">2. コンテンツ情報設計層</text>

    <!-- 4 Sub-boxes (Grid) -->
    <g transform="translate(15, 38)">
      <!-- Box 1: Claude -->
      <rect x="0" y="0" width="155" height="70" rx="8" fill="#131722" stroke="#ea580c" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#ea580c"/>
      <text x="28" y="22" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">1. Claude</text>
      <text x="12" y="40" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">裏技、Claude Code、</text>
      <text x="12" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">スキル定義、議事録整形</text>

      <!-- Box 2: Gemini -->
      <rect x="168" y="0" width="155" height="70" rx="8" fill="#131722" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="186" cy="18" r="5" fill="#3b82f6"/>
      <text x="196" y="22" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">2. Gemini</text>
      <text x="180" y="40" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">裏技、Deep Research、</text>
      <text x="180" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Canvas推敲、カスタムGem</text>

      <!-- Box 3: NotebookLM -->
      <rect x="336" y="0" width="155" height="70" rx="8" fill="#131722" stroke="#10b981" stroke-width="1"/>
      <circle cx="354" cy="18" r="5" fill="#10b981"/>
      <text x="364" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">3. NotebookLM</text>
      <text x="348" y="40" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">音声文字起こし＆議事録、</text>
      <text x="348" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">原本引用リンク、対談生成</text>

      <!-- Box 4: Dev & Git -->
      <rect x="504" y="0" width="155" height="70" rx="8" fill="#131722" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="522" cy="18" r="5" fill="#8b5cf6"/>
      <text x="532" y="22" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">4. 開発・Git</text>
      <text x="516" y="40" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">基本フロー、コマンド表、</text>
      <text x="516" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">競合解決、PR・チーム開発</text>
    </g>
  </g>

  <!-- Layer 3: Design System & Styling (Eye-friendly UI) -->
  <g transform="translate(35, 305)">
    <rect width="690" height="90" rx="10" fill="#202535" stroke="#10b981" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="url(#themeGrad)"/>
    <text x="90" y="19" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">3. デザインシステム層</text>

    <text x="20" y="52" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">目に優しい低コントラスト配色（custom.css）</text>
    <text x="20" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">・ライト: 温かみのあるペーパーアイボリー (#f7f6f2)　・ダーク: 刺激の少ないスレートチャコール (#16181d)</text>

    <rect x="540" y="48" width="130" height="28" rx="6" fill="#131722" stroke="#334155" stroke-width="1"/>
    <text x="605" y="66" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Vanilla CSS 設計</text>
  </g>
</svg>
